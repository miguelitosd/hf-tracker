# nginx config for the HF tracker container.
# Paths that are relative resolve against the prefix /var/hf (set by hf-start via -p).
worker_processes 1;
pid run/nginx.pid;
error_log log/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log log/nginx-access.log;
    sendfile on;

    # nginx runs unprivileged in the container, so keep all temp dirs in the bound var/.
    client_body_temp_path run/tmp/client_body;
    fastcgi_temp_path     run/tmp/fastcgi;
    proxy_temp_path       run/tmp/proxy;
    uwsgi_temp_path       run/tmp/uwsgi;
    scgi_temp_path        run/tmp/scgi;

    server {
        # No authentication: listen on localhost only.  Change to e.g. 0.0.0.0:8577
        # (or put a reverse proxy with auth in front) for access from other hosts.
        listen 0.0.0.0:8577;
        server_name _;

        root /srv/www;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        location /cgi-bin/ {
            gzip off;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HF_DB /var/hf/data/tracker.db;
            fastcgi_pass unix:/var/hf/run/fcgiwrap.sock;
        }
    }
}
